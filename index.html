<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bobs asom website (0)</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 40px;
        }
        
        /* linkysssagain */
        .links-container {
            text-align: left;
            margin: 20px 0;
        }

        /* pill with can growh */
        .oval-btn {
            display: inline-block;
            background-color: #333;
            color: #fff;
            padding: 10px 30px;
            margin: 8px 0;
            border-radius: 50px; 
            text-decoration: none;
            font-weight: bold;
            border: 2px solid #555;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .oval-btn:hover {
            background-color: #555;
            transform: scale(1.05);
        }

        /* sharp cube filled with text */
        .text-box {
            width: 240px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #555;
            background-color: #222;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        /* charkmork button */
        .check-btn {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 5px;
            transition: 0.2s;
        }
        .check-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <p>welcome to my asom site :]</p>

    <!-- cool image -->
    <div style="margin: 20px 0; text-align: center;">
      <img src="main.png" alt="Main Image" id="main-img" style="max-width: 100%; height: auto; cursor: pointer;" onclick="incrementClicks()">
    </div>

    <!-- linkys -->
    <div class="links-container">
        <div><a href="https://cebastians.site" class="oval-btn">index</a></div>
        <div><a href="https://cebastians.site" class="oval-btn">index</a></div>
        <div><a href="https://cebastians.site" class="oval-btn">index</a></div>
        <div><a href="https://cebastians.site" class="oval-btn">index</a></div>
        <div><a href="https://cebastians.site" class="oval-btn">index</a></div>
    </div>

    <br>

    <!-- discord spamer -->
    <div style="margin-top: 10px;">
        <input type="text" id="user-msg" class="text-box" maxlength="200" placeholder="Type a message (max 200 chars)...">
        <button class="check-btn" onclick="sendDiscordWebhook()">✓</button>
    </div>

    <script>
        let clickCount = 0;

        function incrementClicks() {
            clickCount++;
            document.title = `bobs asom website (${clickCount})`;
        }

        function sendDiscordWebhook() {
            const msg = document.getElementById('user-msg').value;
            if (!msg.trim()) {
                alert('Type something first!');
                return;
            }

            const webhookUrl = 'https://discord.com/api/webhooks/1562637149285785612/t3d3Lh2KF_143I6bavdn7AwlWnlxc_Nc6QZCsxZDd2XEMKjZuO22N8xl9ThZ7nRdLOrT';
            
            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    content: msg
                })
            })
            .then(response => {
                if (response.ok) {
                    alert('Sent to Discord successfully!');
                    document.getElementById('user-msg').value = '';
                } else {
                    alert('Failed to send message.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error sending message.');
            });
        }
    </script>

</body>
</html>
